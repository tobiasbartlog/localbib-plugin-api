# Release workflow of localbib-plugin-api, the LocalBib Add-on Contract (ADR-0021).
#
# This repository is exported from the LocalBib development repo; the file is
# added by the export. On a version tag it builds sdist and wheel, smoke-tests
# the wheel and publishes both to PyPI via Trusted Publishing - no API token is
# stored anywhere. One-time setup on pypi.org: add a trusted publisher for this
# repository, workflow `release.yml`, environment `pypi`.
name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag matches the package version
        run: python -c "import os, sys, tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; t = os.environ['GITHUB_REF_NAME']; sys.exit(0 if t == 'v' + v else 'tag ' + t + ' does not match the package version v' + v)"
      - name: Build sdist and wheel
        run: python -m pip install build && python -m build
      - name: Smoke-test the wheel
        run: python -m pip install dist/*.whl && python -m plugin_api.addon_tool --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
